# kong.yml
_format_version: "3.0"
_transform: true

services:
  - name: auth
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1
        paths:
          - /auth/v1
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["*"]
          exposed_headers: ["*"]
          credentials: true
          max_age: 3600

  - name: rest
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1
        paths:
          - /rest/v1
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["*"]
          exposed_headers: ["*"]
          credentials: true

  - name: storage
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1
        paths:
          - /storage/v1
        strip_path: true
    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["*"]
          exposed_headers: ["*"]
          credentials: true
